name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: posix, pcntl
          coverage: none
          tools: phpunit:9.6

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y pigz rsync

      - name: Run tests
        run: bash tools/run-tests.sh

